<!DOCTYPE html>
<html lang="zh-Hans" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROTOTYPE · 面板事件行「更换声音」入口形制（Q1）</title>
<!--
  一次性原型，回答 grill Q1：面板事件行的「更换声音」入口该是什么形制。
  三个变体（结构互异），底部浮条或 ←/→ 键切换，URL ?variant=A|B|C 可分享：
    A — 身份区升格：声音文件名变成 Menu（沿用 2026 批准的「stop.mp3 ▾」先例，零新增元素）
    B — 行尾第三控件：hover 显现「更换…」chip（2026 否决过的「⋯」方案，用来亲身感受拥挤）
    C — 纯右键菜单：行视觉零变化，右键出菜单（不可发现 + 键盘不可达，否决理由仍在）
    D — 单动作链接（Q4 候选）：无菜单无 ▾，文件名即链接按钮，点击直接深链；动词挪进 tooltip，
        出厂包时 tooltip 变「查看声音…」（用面板上方开关切换包性质体验）
  所有交互都是假的：菜单项只弹出 toast 说明将发生的深链，不写任何状态。
-->
<style>
  [hidden] { display: none !important; }
  :root {
    --page-font: ui-rounded, -apple-system, "SF Pro Rounded", "PingFang SC", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --ease-enter: cubic-bezier(.2,.7,.2,1);
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --backdrop1: #121110; --backdrop2: #1C1916;
    --page-text: #F4EBDD;
    --panel-a: #211D19; --panel-b: #171512;
    --text: #F4EBDD; --text-2: #B0AEA5; --muted: #6F665B;
    --hairline: rgba(245,235,221,.10); --hairline-strong: rgba(245,235,221,.16);
    --clay: #D97757; --focus: #0A84FF;
    --hover: rgba(245,235,221,.06);
    --menu-bg: rgba(38,35,31,.92);
    --shadow-pop: 0 1px 2px rgba(0,0,0,.5), 0 18px 48px rgba(0,0,0,.55);
    --ev-blue: #0A84FF; --ev-green: #34C759; --ev-amber: #FF9F0A;
    --ev-clay: #D97757; --ev-indigo: #5E5CE6;
  }
  [data-theme="light"] {
    color-scheme: light;
    --backdrop1: #E9E2D6; --backdrop2: #D8CBB8;
    --page-text: #2B2620;
    --panel-a: #FFFDFA; --panel-b: #FBF7F1;
    --text: #2B2620; --text-2: #75685A; --muted: #AB9E8E;
    --hairline: rgba(60,44,32,.08); --hairline-strong: rgba(60,44,32,.14);
    --clay: #C4633C; --focus: #0A72D0;
    --hover: rgba(60,44,32,.05);
    --menu-bg: rgba(255,253,250,.94);
    --shadow-pop: 0 1px 2px rgba(40,30,20,.12), 0 18px 48px rgba(40,30,20,.20);
    --ev-blue: #0A72D0; --ev-green: #288B43; --ev-amber: #AC6900;
    --ev-clay: #C4633C; --ev-indigo: #5B59D6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--page-font); background: var(--backdrop1); color: var(--page-text); min-height: 100vh; }

  .stage {
    position: relative; min-height: 100vh; padding: 26px 24px 120px;
    background: radial-gradient(120% 90% at 20% 0%, var(--backdrop2), transparent 62%), var(--backdrop1);
    display: flex; flex-direction: column; align-items: center; gap: 18px;
  }
  .menubar {
    position: absolute; top: 0; left: 0; right: 0; height: 26px;
    display: flex; align-items: center; gap: 18px; padding: 0 18px;
    font-size: 12px; border-bottom: 1px solid var(--hairline-strong);
  }
  .menubar .mb-icon { margin-left: auto; width: 18px; height: 18px; border-radius: 4.5px;
    background: #D8F447; box-shadow: 0 0 0 1px rgba(23,43,37,.16) inset; }

  /* ========== 面板（312pt，nonactivating） ========== */
  .panel {
    margin-top: 20px; width: 312px; border-radius: 13px; overflow: hidden;
    background: linear-gradient(180deg, var(--panel-a), var(--panel-b));
    border: 1px solid var(--hairline-strong); box-shadow: var(--shadow-pop); color: var(--text);
  }
  .p-head { display: flex; align-items: center; gap: 8px; padding: 11px 14px 9px; border-bottom: 1px solid var(--hairline); }
  .p-head .scope { font-size: 12.5px; font-weight: 700; }
  .p-head .gear { margin-left: auto; color: var(--muted); font-size: 13px; background: none; border: none; cursor: pointer; padding: 2px 4px; border-radius: 5px; }
  .p-head .gear:hover { color: var(--text); background: var(--hover); }
  .p-sec { padding: 7px 8px; }
  .p-sec + .p-sec { border-top: 1px solid var(--hairline); }
  .p-sec-title { font-size: 10px; font-weight: 600; letter-spacing: .04em; color: var(--muted); padding: 2px 8px 5px; }

  .pack-row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 7px; font-size: 12px; }
  .pack-row .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
  .pack-row.current { background: var(--hover); font-weight: 600; }
  .pack-row.current .dot { background: var(--ev-green); }
  .pack-row .star { margin-left: auto; color: var(--muted); font-size: 11px; }

  /* ========== 事件行（与 PanelAgentEventRow 同构） ========== */
  .ev-row {
    display: flex; align-items: center; gap: 7px; padding: 7px 8px; border-radius: 8px;
    position: relative;
  }
  .ev-row:hover { background: var(--hover); }
  .ev-row .glyph { width: 23px; height: 23px; flex: none; }
  .ev-row .rt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .ev-row .t { font-size: 12.5px; font-weight: 600; }
  .ev-row .s { font: 500 10.5px var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ev-row .acts { display: flex; align-items: center; gap: 5px; flex: none; }
  .ev-row.muted .t, .ev-row.muted .s { opacity: .45; }

  .icon-btn {
    width: 24px; height: 24px; border-radius: 6px; border: none; background: transparent;
    color: var(--text-2); cursor: pointer; display: inline-grid; place-items: center; padding: 0;
  }
  .icon-btn:hover { background: var(--hover); color: var(--text); }
  .icon-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .icon-btn svg { width: 14px; height: 14px; }

  /* ---- 变体 A：声音文件名升格为 Menu ---- */
  .sound-link {
    font: 500 10.5px var(--mono); color: var(--muted); background: none; border: none; padding: 0 2px;
    margin-left: -2px; cursor: pointer; text-align: left; border-radius: 4px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%;
  }
  .sound-link .caret { display: inline-block; margin-left: 2px; font-size: 8px; opacity: 0; transition: opacity 120ms var(--ease-enter); }
  .ev-row:hover .sound-link .caret, .sound-link:focus-visible .caret { opacity: .9; }
  .sound-link:hover, .sound-link.open { color: var(--clay); text-decoration: underline; text-underline-offset: 2px; }
  .sound-link:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; color: var(--clay); }

  /* ---- 变体 D：单动作链接 + tooltip + 包性质开关 ---- */
  .sound-jump { font: 500 10.5px var(--mono); color: var(--muted); background: none; border: none; padding: 0 2px; margin-left: -2px; cursor: pointer; border-radius: 4px; text-align: left; }
  .sound-jump:hover { color: var(--clay); text-decoration: underline; text-underline-offset: 2px; }
  .sound-jump:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; color: var(--clay); }
  .pack-toggle { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); }
  .pack-toggle .seg { display: flex; border: 1px solid var(--hairline-strong); border-radius: 7px; overflow: hidden; }
  .pack-toggle .seg button { border: none; background: transparent; color: var(--text-2); font: 600 10.5px var(--page-font); padding: 3px 10px; cursor: pointer; }
  .pack-toggle .seg button.on { background: var(--focus); color: #fff; }
  .tip { position: fixed; z-index: 90; padding: 4px 9px; border-radius: 6px; background: var(--menu-bg); border: 1px solid var(--hairline-strong); color: var(--text); font-size: 11px; box-shadow: var(--shadow-pop); display: none; pointer-events: none; }
  .tip.show { display: block; }

  /* ---- 变体 B：行尾第三控件（hover 显现） ---- */
  .change-chip {
    font: 600 10px var(--page-font); color: var(--clay); background: none;
    border: 1px solid var(--clay); border-radius: 5px; padding: 2px 6px; cursor: pointer;
    opacity: 0; transition: opacity 120ms var(--ease-enter);
  }
  .ev-row:hover .change-chip, .ev-row:focus-within .change-chip { opacity: 1; }
  .change-chip:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; opacity: 1; }

  /* ---- 变体 C 提示条 ---- */
  .rc-hint {
    margin: 4px 8px 2px; padding: 5px 8px; border: 1px dashed var(--hairline-strong); border-radius: 6px;
    font-size: 10.5px; color: var(--muted); text-align: center;
  }

  /* ========== macOS 风格菜单 ========== */
  .menu {
    position: fixed; z-index: 50; min-width: 190px; padding: 5px; border-radius: 8px;
    background: var(--menu-bg); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
    border: 1px solid var(--hairline-strong); box-shadow: var(--shadow-pop);
    font-size: 12.5px; display: none;
  }
  .menu.open { display: block; }
  .menu .mi {
    display: flex; align-items: center; gap: 7px; width: 100%; padding: 4px 10px; border-radius: 5px;
    border: none; background: none; color: var(--text); font: inherit; cursor: pointer; text-align: left;
  }
  .menu .mi:hover { background: var(--focus); color: #fff; }
  .menu .mi .hint { margin-left: auto; font-size: 10.5px; opacity: .55; }
  .menu .sep { height: 1px; margin: 5px 10px; background: var(--hairline-strong); }

  /* ========== 注释卡 / toast / 切换条 ========== */
  .note { width: 312px; font-size: 11.5px; line-height: 1.65; color: var(--text-2); }
  .note b { color: var(--text); }
  .note .tag { display: inline-block; font: 600 10px var(--page-font); padding: 1px 6px; border-radius: 4px; background: var(--clay); color: #FFFDFA; margin-right: 5px; }
  .toast {
    position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%) translateY(8px);
    background: var(--menu-bg); backdrop-filter: blur(20px); color: var(--text);
    border: 1px solid var(--hairline-strong); border-radius: 8px; padding: 8px 14px;
    font-size: 11.5px; box-shadow: var(--shadow-pop); opacity: 0; pointer-events: none;
    transition: opacity 160ms var(--ease-enter), transform 160ms var(--ease-enter);
    max-width: 420px; text-align: center; z-index: 60;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .switcher {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 70;
    display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 999px;
    background: #D8F447; color: #172B25; box-shadow: 0 8px 28px rgba(0,0,0,.35);
    font-size: 12.5px; font-weight: 600; user-select: none;
  }
  .switcher button {
    border: none; background: rgba(23,43,37,.12); color: #172B25; width: 26px; height: 26px;
    border-radius: 50%; cursor: pointer; font-size: 13px; font-weight: 700;
  }
  .switcher button:hover { background: rgba(23,43,37,.24); }
  .switcher .vlabel { min-width: 210px; text-align: center; }
  .switcher .theme-btn { width: auto; border-radius: 13px; padding: 0 10px; font-size: 11px; }
</style>
</head>
<body>
<div class="stage">
  <div class="menubar"><span>访达</span><span>文件</span><span>编辑</span><span class="mb-icon"></span></div>

  <div class="pack-toggle" id="packToggle" hidden>
    包性质（演示用）：
    <span class="seg"><button data-pt="user" class="on">用户包</button><button data-pt="factory">出厂包</button></span>
  </div>

  <div class="panel" id="panel">
    <div class="p-head">
      <span class="scope">默认组</span>
      <button class="gear" title="设置">⚙</button>
    </div>
    <div class="p-sec">
      <div class="p-sec-title">声音包</div>
      <div class="pack-row current"><span class="dot"></span>软木槌<span class="star">★</span></div>
      <div class="pack-row"><span class="dot"></span>夜间控制台<span class="star">★</span></div>
    </div>
    <div class="p-sec">
      <div class="p-sec-title">事件</div>
      <div id="rows"></div>
      <div class="rc-hint" id="rcHint" hidden>💡 本变体无任何可见入口 —— 请<strong>右键点击</strong>上面任意事件行<br>（原型不得不贴这行提示，这正是它要证明的问题）</div>
    </div>
    <div class="p-sec">
      <div class="p-sec-title">音量</div>
      <div class="pack-row"><span style="font-size:12px">🔊</span><span style="flex:1;height:4px;border-radius:2px;background:var(--hairline-strong);position:relative"><span style="position:absolute;left:0;top:0;bottom:0;width:65%;border-radius:2px;background:var(--text-2)"></span></span><span class="star">65%</span></div>
    </div>
  </div>

  <div class="note" id="note"></div>
</div>

<div class="menu" id="menu" role="menu"></div>
<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>

<div class="switcher">
  <button id="prev" title="上一个变体（←）">‹</button>
  <span class="vlabel" id="vlabel"></span>
  <button id="next" title="下一个变体（→）">›</button>
  <button class="theme-btn" id="themeBtn" title="切换明暗">◐ 明暗</button>
</div>

<script>
const EVENTS = [
  { id: 'task_start',    name: '任务开始',   color: 'var(--ev-blue)',   glyph: 'plane',        sound: 'launch-chime.aiff' },
  { id: 'stop',          name: '本轮结束',   color: 'var(--ev-green)',  glyph: 'checkFill',    sound: 'soft-mallet.caf' },
  { id: 'stop_failure',  name: '执行中断',   color: 'var(--ev-amber)',  glyph: 'pauseFill',    sound: 'Basso（系统）' },
  { id: 'notification',  name: '待响应',     color: 'var(--ev-clay)',   glyph: 'bell',         sound: 'ping-warm.aiff' },
  { id: 'subagent_stop', name: '子任务结束', color: 'var(--ev-indigo)', glyph: 'checkHollow',  sound: 'tick-soft.caf' },
];

const GLYPHS = {
  plane: c => `<svg class="glyph" viewBox="0 0 24 24" style="color:${c}"><path fill="currentColor" d="M21.6 2.4 2.8 10.6c-.5.2-.4.9.1 1l6.9 1.7 1.7 6.9c.2.5.9.5 1.1.1l8.2-16.8c.2-.5-.3-1-.8-.9z"/></svg>`,
  checkFill: c => `<svg class="glyph" viewBox="0 0 24 24" style="color:${c}"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M7 12.4l3.1 3.1L16.9 9" fill="none" stroke="var(--panel-a)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  pauseFill: c => `<svg class="glyph" viewBox="0 0 24 24" style="color:${c}"><circle cx="12" cy="12" r="10" fill="currentColor"/><rect x="8.4" y="7.4" width="2.5" height="9.2" rx="1.1" fill="var(--panel-a)"/><rect x="13.1" y="7.4" width="2.5" height="9.2" rx="1.1" fill="var(--panel-a)"/></svg>`,
  bell: c => `<svg class="glyph" viewBox="0 0 24 24" style="color:${c}"><path fill="currentColor" d="M11 4.2a4.6 4.6 0 0 1 4.6 4.6v3l1.6 2.7c.2.4-.1.9-.6.9H6.4c-.5 0-.8-.5-.6-.9L7.4 11.8v-3A4.6 4.6 0 0 1 11 4.2z"/><circle cx="11.5" cy="18.3" r="1.7" fill="currentColor"/><circle cx="17.6" cy="5.6" r="3" fill="currentColor" stroke="var(--panel-a)" stroke-width="1.6"/></svg>`,
  checkHollow: c => `<svg class="glyph" viewBox="0 0 24 24" style="color:${c}"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7.6 12.4l2.8 2.8 5.8-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
};
const PLAY = `<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6.3 5.2v5.6l4.6-2.8z" fill="currentColor"/></svg>`;
const SPKR = `<svg viewBox="0 0 16 16"><path d="M2.5 6v4h2.6L9 13.4V2.6L5.1 6z" fill="currentColor"/><path d="M10.6 5.4a3.6 3.6 0 0 1 0 5.2M12.2 3.8a6 6 0 0 1 0 8.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>`;
const SPKR_OFF = `<svg viewBox="0 0 16 16"><path d="M2.5 6v4h2.6L9 13.4V2.6L5.1 6z" fill="currentColor"/><path d="M10.8 6.2l3.4 3.6m0-3.6-3.4 3.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>`;

const VARIANTS = {
  A: {
    label: 'A · 菜单版（两项）',
    note: `<span class="tag">A</span><b>声音文件名带 ▾，点开是两项菜单</b>：更换声音… / 在「声音」页中显示。点「本轮结束」行的 <span style="font-family:var(--mono)">soft-mallet.caf</span> 试试。这是 Q1 批准时的形态——现在拿来和 D 对比：多一次点击，换来一个与「更换声音…」<b>同一落点</b>的纯查看项。`,
  },
  B: {
    label: 'B · 行尾第三控件',
    note: `<span class="tag">B</span><b>hover 时在试听/静音左侧浮现「更换…」chip</b>。最直白，但这正是 2026 被否的「行尾第三颗 ⋯」——注意 312pt 行里四个控件挤在一起的观感，以及它与 P4「行仅图形+名称+试听+开关」的直接冲突。`,
  },
  C: {
    label: 'C · 纯右键菜单',
    note: `<span class="tag">C</span><b>行视觉零变化，右键弹出菜单</b>。零视觉重量、最不打扰 P4；但不可发现（原型被迫贴提示才能让你知道它存在）、键盘与 VoiceOver 无路径——2026 的否决理由原样成立。现实里它只能当 A 的加速器，不能当唯一入口。`,
  },
  D: {
    label: 'D · 单动作链接（Q4 推荐）',
    note: `<span class="tag">D</span><b>无菜单、无 ▾</b>：文件名本身就是链接按钮，点击<b>直接</b>深链（点任意行的文件名试）。动词挪进 tooltip——hover 文件名看「更换声音…」；用上方开关切到<b>出厂包</b>再 hover，tooltip 变「查看声音…」，点击的落点说明也变成只读视图 + 页内「复制并编辑」。砍掉「在『声音』页中显示」：它和「更换声音…」同一落点，一步不少。<br>⚠️ 一笔要认的账：文件名行留在面板是对 P4「删文件名」的修订——它从装饰信息变成入口载体，理由变了，文档里要写明。`,
  },
};
const ORDER = ['A', 'B', 'C', 'D'];

const rowsEl = document.getElementById('rows');
const menuEl = document.getElementById('menu');
const toastEl = document.getElementById('toast');
const noteEl = document.getElementById('note');
const rcHint = document.getElementById('rcHint');
let toastTimer = null;
const muted = new Set();

function toast(msg) {
  toastEl.innerHTML = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2600);
}
function closeMenu() { menuEl.classList.remove('open'); document.querySelectorAll('.sound-link.open').forEach(b => b.classList.remove('open')); }

function openMenu(html, x, y) {
  menuEl.innerHTML = html;
  menuEl.classList.add('open');
  const w = menuEl.offsetWidth, h = menuEl.offsetHeight;
  menuEl.style.left = Math.min(x, innerWidth - w - 8) + 'px';
  menuEl.style.top = Math.min(y, innerHeight - h - 90) + 'px';
}
function deepLinkToast(e) {
  toast(`→ 深链：设置 · 声音 · 软木槌 · 「${e.name}」<br>（typed route + return context，返回时恢复面板现场）`);
}
function changeMenuHTML(e) {
  return `<button class="mi" data-act="change" data-ev="${e.id}">更换声音…</button>` +
         `<button class="mi" data-act="reveal" data-ev="${e.id}">在「声音」页中显示</button>`;
}
function contextMenuHTML(e) {
  return `<button class="mi" data-act="preview" data-ev="${e.id}">试听<span class="hint">▸</span></button>` +
         `<button class="mi" data-act="mute" data-ev="${e.id}">${muted.has(e.id) ? '取消静音' : '静音'}</button>` +
         `<div class="sep"></div>` +
         `<button class="mi" data-act="change" data-ev="${e.id}">更换声音…</button>`;
}

function rowHTML(e, v) {
  const isMuted = muted.has(e.id);
  const sub = v === 'A'
    ? `<button class="sound-link" data-ev="${e.id}" aria-haspopup="menu">${e.sound}<span class="caret">▾</span></button>`
    : v === 'D'
      ? `<button class="sound-jump" data-ev="${e.id}">${e.sound}</button>`
      : `<span class="s">${e.sound}</span>`;
  const chip = v === 'B' ? `<button class="change-chip" data-ev="${e.id}">更换…</button>` : '';
  return `<div class="ev-row ${isMuted ? 'muted' : ''}" data-ev="${e.id}">
    ${GLYPHS[e.glyph](e.color)}
    <span class="rt"><span class="t">${e.name}</span>${sub}</span>
    <span class="acts">${chip}
      <button class="icon-btn" data-act="preview" data-ev="${e.id}" title="试听 ${e.name}">${PLAY}</button>
      <button class="icon-btn" data-act="mute" data-ev="${e.id}" title="${isMuted ? '取消静音' : '静音'}">${isMuted ? SPKR_OFF : SPKR}</button>
    </span>
  </div>`;
}

function render() {
  const v = new URLSearchParams(location.search).get('variant') || 'A';
  rowsEl.innerHTML = EVENTS.map(e => rowHTML(e, v)).join('');
  document.getElementById('vlabel').textContent = VARIANTS[v].label;
  noteEl.innerHTML = VARIANTS[v].note;
  rcHint.hidden = v !== 'C';
  document.getElementById('packToggle').hidden = v !== 'D';
  closeMenu();
}
function setVariant(v) {
  const u = new URL(location.href); u.searchParams.set('variant', v);
  history.replaceState(null, '', u); render();
}
function cycle(d) {
  const v = new URLSearchParams(location.search).get('variant') || 'A';
  setVariant(ORDER[(ORDER.indexOf(v) + d + ORDER.length) % ORDER.length]);
}

document.getElementById('prev').onclick = () => cycle(-1);
document.getElementById('next').onclick = () => cycle(1);
document.getElementById('themeBtn').onclick = () => {
  const h = document.documentElement;
  h.dataset.theme = h.dataset.theme === 'dark' ? 'light' : 'dark';
};
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') cycle(-1);
  if (e.key === 'ArrowRight') cycle(1);
  if (e.key === 'Escape') closeMenu();
});

rowsEl.addEventListener('click', ev => {
  const link = ev.target.closest('.sound-link');
  const chip = ev.target.closest('.change-chip');
  const jump = ev.target.closest('.sound-jump');
  const act = ev.target.closest('[data-act]');
  const e = EVENTS.find(x => x.id === (link || chip || act || jump)?.dataset.ev);
  if (!e) return;
  if (act?.dataset.act === 'preview') { toast(`♪ 试听「${e.name}」（ManualAudioPreviewSession，用当前组增益）`); return; }
  if (act?.dataset.act === 'mute') {
    muted.has(e.id) ? muted.delete(e.id) : muted.add(e.id);
    toast(`已${muted.has(e.id) ? '静音' : '取消静音'}「${e.name}」<br>（写当前组的事件开关，config.lock/CAS）`);
    render(); return;
  }
  if (jump) {
    if (packType === 'factory') {
      toast(`→ 深链：设置 · 声音 · 软木槌 · 「${e.name}」<br>（出厂包只读：落点是查看视图，页内提供「复制并编辑…」）`);
    } else {
      deepLinkToast(e);
    }
    return;
  }
  if (link || chip) {
    const r = (link || chip).getBoundingClientRect();
    if (link) link.classList.add('open');
    openMenu(changeMenuHTML(e), r.left, r.bottom + 4);
  }
});

/* 变体 C：行级右键菜单（A/B 变体下右键不响应，形制差异要能被“感觉到”） */
rowsEl.addEventListener('contextmenu', ev => {
  const v = new URLSearchParams(location.search).get('variant') || 'A';
  if (v !== 'C') return;
  const row = ev.target.closest('.ev-row');
  if (!row) return;
  ev.preventDefault();
  const e = EVENTS.find(x => x.id === row.dataset.ev);
  openMenu(contextMenuHTML(e), ev.clientX, ev.clientY);
});

menuEl.addEventListener('click', ev => {
  const mi = ev.target.closest('.mi');
  if (!mi) return;
  const e = EVENTS.find(x => x.id === mi.dataset.ev);
  closeMenu();
  if (mi.dataset.act === 'change') deepLinkToast(e);
  else if (mi.dataset.act === 'reveal') toast(`→ 深链：设置 · 声音 · 软木槌（仅定位到包）`);
  else if (mi.dataset.act === 'preview') toast(`♪ 试听「${e.name}」`);
  else if (mi.dataset.act === 'mute') {
    muted.has(e.id) ? muted.delete(e.id) : muted.add(e.id);
    toast(`已${muted.has(e.id) ? '静音' : '取消静音'}「${e.name}」`); render();
  }
});
document.addEventListener('click', ev => {
  if (!ev.target.closest('.menu') && !ev.target.closest('.sound-link') && !ev.target.closest('.change-chip')) closeMenu();
});

/* 变体 D：包性质开关 + tooltip */
let packType = 'user';
const tip = document.getElementById('tip');
document.querySelectorAll('#packToggle .seg button').forEach(b => b.addEventListener('click', () => {
  packType = b.dataset.pt;
  document.querySelectorAll('#packToggle .seg button').forEach(x => x.classList.toggle('on', x === b));
}));
rowsEl.addEventListener('mouseover', ev => {
  const j = ev.target.closest('.sound-jump');
  if (!j) return;
  tip.textContent = packType === 'factory' ? '查看声音…（出厂包只读）' : '更换声音…';
  const r = j.getBoundingClientRect();
  tip.style.left = r.left + 'px';
  tip.style.top = (r.top - 27) + 'px';
  tip.classList.add('show');
});
rowsEl.addEventListener('mouseout', ev => {
  if (ev.target.closest('.sound-jump')) tip.classList.remove('show');
});

render();
</script>
</body>
</html>
