 const ghost={...clone(original),id:'ghost',name:'我的幽灵',builtin:false,palette:'mist',gifs:events.map((e,i)=>[0,1,3].includes(i)?clipSample('ghost',i):null)};
 const scopes=()=>[{id:'default',name:'默认组',theme:'ghost',volume:65,enabled:[true,true,true,true,true]},{id:'claudio',name:'Claudio',theme:'duck',volume:55,enabled:[true,true,true,true,false],path:'~/Projects/Claudio'},{id:'notes',name:'Notes',theme:null,volume:40,enabled:[false,true,true,true,false],path:'~/Documents/Notes'}];

 return {version:1,themes:[original,duck,ghost],drafts:{},assets:{},scopes:{pro:scopes(),free},account:'pro',appearance:'light',size:'default',notification:{enabled:true,static:false,character:true,quiet:false},lastRoute:{page:'themes',id:'ghost'},activity:0};
}

 const q=new URLSearchParams(location.search);if(q.has('appearance'))S.appearance=q.get('appearance')==='dark'?'dark':'light';if(q.has('account'))S.account=q.get('account')==='free'?'free':'pro';if(q.has('size'))S.size=q.get('size')==='minimum'?'minimum':'default';
 route=S.lastRoute||route;if(q.has('page'))route={page:q.get('page'),id:q.get('theme')||undefined};if(route.id&&!S.themes.some(t=>t.id===route.id))route={page:'themes'};

}
const groups=()=>S.scopes[S.account];

const theme=id=>S.drafts[id]||saved(id);

const effective=g=>saved(g.theme||groups()[0].theme)||saved('original');
const users=id=>groups().filter(g=>effective(g).id===id);
const paid=t=>!!t.icon||t.gifs.some(g=>g?.custom);
function markDirty(fn){const base=current();if(!base||base.builtin)return;S.drafts[base.id]??=clone(base);fn(S.drafts[base.id]);persist();render(true)}
function setRoute(next,push=true){stopAudio();$('context-menu').hidden=true;if($('sheet').open)closeSheet();route=next;if(push){history=history.slice(0,historyIndex+1);history.push(clone(next));historyIndex=history.length-1}S.lastRoute=clone(next);persist();render();$('page-scroll').scrollTop=0}
