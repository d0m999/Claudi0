name: Public Preview Candidate and Publish
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [build, publish]
        default: build
        required: true
      version:
        description: '0.0.N (first preview 0.0.1)'
        required: true
      target_commit:
        description: 'Exact reviewed source commit (40 lowercase hex characters)'
        required: true
      candidate_run_id:
        description: 'Accepted build run; required only for publish'
      release_authorized:
        description: 'Records separately granted public-release authorization'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: public-preview-channel
  cancel-in-progress: false
jobs:
  build:
    if: inputs.mode == 'build'
    runs-on: macos-15
    env:
      CLAUDIO_VERSION: ${{ inputs.version }}
      TARGET_COMMIT: ${{ inputs.target_commit }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - name: Validate fixed source
        run: |
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$TARGET_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CLAUDIO_VERSION" =~ ^0\.0\.[1-9][0-9]*$ ]]
          [[ "$(git rev-parse HEAD)" == "$TARGET_COMMIT" && "$GITHUB_SHA" == "$TARGET_COMMIT" ]]
      - name: Complete automated gates
        run: |
          swift scripts/prepare-ci-display.swift
          swift run --package-path helper claudio-tests
          swift run --package-path gui claudio-gui-tests
          swift build -c debug --package-path gui --product ClaudioGUI
          swift build -c release --package-path gui --product ClaudioGUI
          bash scripts/test-hook-cli-contract.sh
          bash scripts/test-legacy-install-cli-contract.sh
          python3 scripts/embed-opencode-plugin.py --check
          node scripts/test-opencode-plugin.mjs
          python3 scripts/test-additional-host-cli-contract.py
          python3 scripts/test-additional-host-migration.py
          jq empty gui/Sources/ClaudioLocalization/Resources/Localizable.xcstrings
          swift run --package-path gui -Xswiftc -DCLAUDIO_PUBLIC_PREVIEW claudio-gui-tests --public-preview
          swift run --package-path gui -Xswiftc -DCLAUDIO_PUBLIC_PREVIEW claudio-gui-tests --ai-cue-gallery
          python3 scripts/test-preview-artifact.py
          bash scripts/test-sparkle-contract.sh
          git diff --check
      - name: Build immutable universal preview
        run: python3 scripts/build-preview.py "$CLAUDIO_VERSION" "$TARGET_COMMIT"
      - uses: actions/upload-artifact@v4
        with:
          name: preview-${{ inputs.version }}-${{ inputs.target_commit }}
          if-no-files-found: error
          path: |
            dist/claudi0-${{ inputs.version }}.dmg
            dist/PREVIEW_MANIFEST.json
            dist/SHA256SUMS.txt
  publish:
    if: inputs.mode == 'publish' && inputs.release_authorized
    runs-on: macos-15
    environment: public-preview
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      TARGET_COMMIT: ${{ inputs.target_commit }}
      CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - name: Download and verify exact accepted artifact
        run: |
          [[ "$GITHUB_REF" == refs/heads/main ]]
          python3 scripts/download-preview-candidate.py "$CANDIDATE_RUN" "$TARGET_COMMIT" "$VERSION" candidate
          python3 scripts/verify-preview.py dmg "candidate/claudi0-$VERSION.dmg" "$VERSION"
      - name: Resolve pinned signing tools (no application compilation)
        run: swift package --package-path gui resolve
      - name: Generate and verify signed staging feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          python3 scripts/fetch-preview-feed.py previous.xml "$VERSION"
          if [[ -f previous.xml ]]; then
            python3 scripts/preview-artifact.py prepare candidate --output pages --previous previous.xml
          else
            python3 scripts/preview-artifact.py prepare candidate --output pages
          fi
      - name: Publish original DMG and verify public bytes
        run: |
          gh release create "preview-v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$TARGET_COMMIT" --prerelease --title "claudi0 $VERSION — 公开预览" --notes-file candidate/RELEASE_NOTES.md "candidate/claudi0-$VERSION.dmg" candidate/SHA256SUMS.txt candidate/PREVIEW_MANIFEST.json
          python3 scripts/verify-public-preview.py candidate
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - uses: actions/deploy-pages@v4
      - name: Verify deployed signed feed
        run: |
          curl --fail --proto '=https' --tlsv1.2 --retry 5 --retry-delay 5 --max-time 30 https://d0m999.github.io/Claudi0/preview/appcast.xml -o deployed.xml
          cmp pages/preview/appcast.xml deployed.xml
          swift scripts/verify-sparkle-signature.swift feed config/sparkle-public-key.txt deployed.xml
