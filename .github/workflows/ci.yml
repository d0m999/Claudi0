name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helper:
    name: Helper
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      NSUnbufferedIO: YES
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain
        id: toolchain
        uses: ./.github/actions/swift-toolchain-fingerprint
        with:
          version-pattern: 'Apple\ Swift\ version\ 6\.'
          version-error: Swift 6 is required; selected toolchain reported

      - name: Verify CI Git and cache contracts
        run: |
          python3 scripts/test-ci-cache-identity.py
          python3 scripts/test-ci-whitespace.py
          python3 scripts/test-ci-gui-harness.py
          python3 scripts/test-ci-swift-toolchain.py

      - name: Restore SwiftPM build cache
        uses: actions/cache@v5
        with:
          path: helper/.build
          key: helper-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('helper/Package.resolved', 'helper/Package.swift') }}-v2

      - name: Check patch whitespace
        shell: bash
        env:
          CLAUDIO_CI_EVENT_NAME: ${{ github.event_name }}
          CLAUDIO_CI_PUSH_BEFORE: ${{ github.event.before }}
          CLAUDIO_CI_PUSH_HEAD: ${{ github.sha }}
          CLAUDIO_CI_PR_BASE: ${{ github.event.pull_request.base.sha }}
          CLAUDIO_CI_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "$CLAUDIO_CI_EVENT_NAME" == "pull_request" ]]; then
            base="$CLAUDIO_CI_PR_BASE"
            head="$CLAUDIO_CI_PR_HEAD"
          else
            base="$CLAUDIO_CI_PUSH_BEFORE"
            head="$CLAUDIO_CI_PUSH_HEAD"
          fi

          if [[ -z "$base" || -z "$head" ]]; then
            echo "::error::unable to determine the revision range for whitespace validation"
            exit 1
          fi

          if [[ "$base" =~ ^0+$ ]]; then
            git diff-tree --check --root -r "$head"
          else
            # A rewritten branch may no longer advertise the push event's exact baseline.
            if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$base"
            fi
            git diff --check "$base" "$head"
          fi

      - name: Verify development version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(swift run --package-path helper claudio --version)"
          if [[ "$VERSION" != "0.0.0-dev" ]]; then
            echo "::error::development CLI version must be 0.0.0-dev; got $VERSION"
            exit 1
          fi

      - name: Run helper harness
        run: swift run --package-path helper claudio-tests

      - name: Verify OpenCode plugin contracts
        run: |
          python3 scripts/embed-opencode-plugin.py --check
          node scripts/test-opencode-plugin.mjs
          bash scripts/test-hook-cli-contract.sh
          python3 scripts/test-additional-host-cli-contract.py

  gui:
    name: GUI background and native checks
    runs-on: macos-26
    # Background batch plus the focused native selectors and both credential galleries.
    timeout-minutes: 45
    env:
      # Match the measured stable compiler and SDK used by all bundle-producing lanes.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      NSUnbufferedIO: YES
      CLAUDIO_TEST_SUITE_TIMINGS: "1"
      CLAUDIO_EVENT_ATTENTION_P95_MS: "250"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select pinned Swift toolchain
        run: python3 scripts/setup-ci-swift.py

      - name: Toolchain
        id: toolchain
        uses: ./.github/actions/swift-toolchain-fingerprint
        with:
          version-pattern: 'Swift\ version\ 6\.4\.1([[:space:]]|$)'
          version-error: Swift 6.4.1 is required; selected toolchain reported

      - name: Restore SwiftPM build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            gui/.build
            helper/.build
          key: gui-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('helper/Package.resolved', 'helper/Package.swift', 'gui/Package.swift', 'gui/Package.resolved') }}-v3

      - name: Validate string catalog JSON
        run: jq empty gui/Sources/ClaudioLocalization/Resources/Localizable.xcstrings

      - name: Prepare native layout display
        run: swift scripts/prepare-ci-display.swift

      - name: Diagnose event-attention harness
        shell: bash
        env:
          CLAUDIO_HANG_DIAGNOSTICS: "1"
        run: |
          swift build --package-path gui --product claudio-gui-tests
          set -u
          swift run --skip-build --package-path gui claudio-gui-tests --foreground --event-attention &
          HARNESS_PID=$!
          (
            sleep 240 &
            TIMER_PID=$!
            trap 'kill "$TIMER_PID" 2>/dev/null || true; exit 0' TERM INT
            wait "$TIMER_PID"
            trap - TERM INT
            if kill -0 "$HARNESS_PID" 2>/dev/null; then
              echo "::error::event-attention harness exceeded 240 seconds; sampling pid $HARNESS_PID"
              /usr/bin/sample "$HARNESS_PID" 5 10 || true
              kill -ABRT "$HARNESS_PID" 2>/dev/null || true
            fi
          ) &
          WATCHDOG_PID=$!
          set +e
          wait "$HARNESS_PID"
          STATUS=$?
          set -e
          kill "$WATCHDOG_PID" 2>/dev/null || true
          wait "$WATCHDOG_PID" 2>/dev/null || true
          exit "$STATUS"

      - name: Verify native sidebar backing grids
        run: swift run --skip-build --package-path gui claudio-gui-tests --settings-sidebar-backing

      - name: Verify native event animation layout
        run: swift run --skip-build --package-path gui claudio-gui-tests --foreground --event-animation-layout

      - name: Verify native notification navigation
        run: swift run --skip-build --package-path gui claudio-gui-tests --foreground --settings-notification-navigation

      - name: Run background GUI checks
        run: python3 scripts/run-ci-gui-harness.py --timeout 2400 -- swift run --skip-build --package-path gui claudio-gui-tests --background

      - name: Verify admitted AI Cue credential gallery
        run: swift run --package-path gui -Xswiftc -DCLAUDIO_BAILIAN_ACCEPTANCE claudio-gui-tests --foreground --ai-cue-gallery

      - name: Verify public preview credential gallery
        run: swift run --package-path gui -Xswiftc -DCLAUDIO_PUBLIC_PREVIEW claudio-gui-tests --foreground --ai-cue-gallery

  gui-foreground:
    name: GUI foreground checks
    runs-on: macos-26
    # Full foreground batch on a dedicated runner; native suites must run serially.
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      NSUnbufferedIO: YES
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select pinned Swift toolchain
        run: python3 scripts/setup-ci-swift.py

      - name: Toolchain
        id: toolchain
        uses: ./.github/actions/swift-toolchain-fingerprint
        with:
          version-pattern: 'Swift\ version\ 6\.4\.1([[:space:]]|$)'
          version-error: Swift 6.4.1 is required; selected toolchain reported

      - name: Restore SwiftPM build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            gui/.build
            helper/.build
          key: gui-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('helper/Package.resolved', 'helper/Package.swift', 'gui/Package.swift', 'gui/Package.resolved') }}-v3

      - name: Prepare native layout display
        run: swift scripts/prepare-ci-display.swift

      - name: Build GUI harness
        run: swift build --package-path gui --product claudio-gui-tests

      - name: Run foreground GUI checks
        run: python3 scripts/run-ci-gui-harness.py --timeout 2400 -- swift run --skip-build --package-path gui claudio-gui-tests --foreground

  gui-bundle:
    name: GUI bundle and size
    runs-on: macos-26
    # Debug/Release products, the local release-layout app, and the only cache writer.
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      NSUnbufferedIO: YES
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select pinned Swift toolchain
        run: python3 scripts/setup-ci-swift.py

      - name: Toolchain
        id: toolchain
        uses: ./.github/actions/swift-toolchain-fingerprint
        with:
          version-pattern: 'Swift\ version\ 6\.4\.1([[:space:]]|$)'
          version-error: Swift 6.4.1 is required; selected toolchain reported

      - name: Restore SwiftPM build cache
        id: swiftpm-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            gui/.build
            helper/.build
          key: gui-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('helper/Package.resolved', 'helper/Package.swift', 'gui/Package.swift', 'gui/Package.resolved') }}-v3

      - name: Build GUI harness for the shared cache
        run: swift build --package-path gui --product claudio-gui-tests

      - name: Build ClaudioGUI (Debug)
        run: swift build -c debug --package-path gui --product ClaudioGUI

      - name: Build ClaudioGUI (Release)
        run: swift build -c release --package-path gui --product ClaudioGUI --experimental-lto-mode full -Xswiftc -Osize

      - name: Assemble local release-layout app
        run: bash scripts/dev-bundle.sh

      - name: Verify release size budget
        run: bash scripts/check-release-size.sh dist/claudi0.app

      - name: Save SwiftPM build cache
        if: steps.swiftpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            gui/.build
            helper/.build
          key: gui-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('helper/Package.resolved', 'helper/Package.swift', 'gui/Package.swift', 'gui/Package.resolved') }}-v3

  verify:
    name: Test and build
    if: ${{ !cancelled() }}
    needs: [helper, gui, gui-foreground, gui-bundle]
    runs-on: ubuntu-latest
    steps:
      - name: Require every lane
        env:
          HELPER_RESULT: ${{ needs.helper.result }}
          GUI_RESULT: ${{ needs.gui.result }}
          GUI_FOREGROUND_RESULT: ${{ needs['gui-foreground'].result }}
          GUI_BUNDLE_RESULT: ${{ needs['gui-bundle'].result }}
        run: |
          test "$HELPER_RESULT" = success
          test "$GUI_RESULT" = success
          test "$GUI_FOREGROUND_RESULT" = success
          test "$GUI_BUNDLE_RESULT" = success
